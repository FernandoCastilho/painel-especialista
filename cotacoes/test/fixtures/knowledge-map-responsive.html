<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Teste responsivo do mapa</title><style>body{margin:0;background:#20252f;color:white;font:14px system-ui}nav{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:12px;cursor:pointer}iframe{display:block;width:390px;height:1000px;border:0;background:white;margin:0 auto;max-width:100%}</style></head><body><nav aria-label="Largura de teste"><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><button data-height="568">Altura 568 px</button><button data-height="844">Altura 844 px</button></nav><iframe src="/#aprender/mapa" title="Painel em teste"></iframe><script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{const frame=document.querySelector('iframe');if(button.dataset.width)frame.style.width=button.dataset.width+'px';if(button.dataset.height)frame.style.height=button.dataset.height+'px'}</script></body></html>
