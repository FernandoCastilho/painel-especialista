name: Cotações CI
on:
  workflow_call:
  push:
    branches: ['feat/estudos-setoriais-completos']
    paths: ['cotacoes/**', 'docs/sector-research/**', '.github/workflows/cotacoes-ci.yml']
  pull_request:
    paths: ['cotacoes/**', '.github/workflows/cotacoes-ci.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Preparar ensaio semanal com dados simulados
        run: node test/helpers/weekly-package.mjs "$RUNNER_TEMP/weekly-package-test.json"
      - run: npm run build
      - name: Conferir preservação no build real
        run: node scripts/weekly-data.mjs dist "$RUNNER_TEMP/weekly-package-test.json"
  smoke:
    runs-on: ubuntu-24.04
    needs: test-build
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cotacoes
    env:
      SMOKE_BASE_URL: http://127.0.0.1:8768
      SMOKE_CHANNEL: chrome
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - name: Build com os dados na própria origem
        run: VITE_DATA_BASE=http://127.0.0.1:8768 npm run build
      - name: Preparar Playwright com o Chrome do ambiente de testes
        timeout-minutes: 3
        run: |
          npm install --no-save playwright@1.63.0
          google-chrome --version
      - name: Servir o build
        id: serve
        run: |
          nohup python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
      - name: Conferir mapas de recuperação judicial, tooltips e rótulos
        run: SEARCH_QA_OUTPUT="$RUNNER_TEMP/qa-universal/recovery" node scripts/smoke-recuperacao.cjs
      - name: Capturas dos mapas de recuperação judicial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-maps-design
          path: ${{ runner.temp }}/qa-universal/recovery
          if-no-files-found: error
          retention-days: 7
      - name: Conferir Comparador de Crédito, cenários e apresentação
        run: CREDIT_QA_OUTPUT="$RUNNER_TEMP/qa-universal/credit" node scripts/smoke-credit-comparison.cjs
      - name: Conferir Operação x DI (CET, IOF e vencimento em dia útil)
        run: OPERACAO_DI_QA_OUTPUT="$RUNNER_TEMP/qa-universal/operacao-di" node scripts/smoke-operacao-di.cjs
      - name: Conferir Empréstimo externo 4131 (IOF, gross-up, swap, NDF, apresentação e PDF)
        run: EMPRESTIMO_4131_QA_OUTPUT="$RUNNER_TEMP/qa-universal/emprestimo-4131" node scripts/smoke-emprestimo-4131.cjs
      - name: Capturas e resultado do Comparador de Crédito
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credit-comparison-design
          path: ${{ runner.temp }}/qa-universal/credit
          if-no-files-found: error
          retention-days: 7
      - name: Conferir Bancos em celular, tablet e desktop nos dois temas
        run: BANKS_QA_OUTPUT="$RUNNER_TEMP/qa-universal/bancos" node scripts/smoke-bancos.cjs
      - name: Capturas e relatório da seção Bancos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bancos-design
          path: ${{ runner.temp }}/qa-universal/bancos
          if-no-files-found: error
          retention-days: 7
      - name: Conferir curadorias de tributos e escala 6x1
        run: CURADORIA_QA_OUTPUT="$RUNNER_TEMP/qa-universal/curadoria" node scripts/smoke-curadoria.cjs
      - name: Conferir coleta institucional publicada e falhas de confirmação
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: INSTITUTIONAL_NEWS_QA_OUTPUT="$RUNNER_TEMP/qa-universal/institutional-news" node scripts/smoke-institutional-news.cjs
      - name: Capturas e relatório da coleta institucional
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-news-design
          path: ${{ runner.temp }}/qa-universal/institutional-news
          if-no-files-found: error
          retention-days: 7
      - name: Conferir CBS, dados setoriais e necessidade adicional de giro
        run: CBS_QA_OUTPUT="$RUNNER_TEMP/qa-universal/cbs" node scripts/smoke-cbs.cjs
      - name: Capturas e resultado do simulador CBS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbs-caixa-design
          path: ${{ runner.temp }}/qa-universal/cbs
          if-no-files-found: error
          retention-days: 7
      - name: Conferir mapa do conhecimento em quatro cenários
        timeout-minutes: 3
        run: KNOWLEDGE_QA_OUTPUT="$RUNNER_TEMP/qa-universal/knowledge-map" node scripts/smoke-knowledge-map.cjs
      - name: Capturas e relatório imediatos do mapa do conhecimento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapa-conhecimento-design
          path: ${{ runner.temp }}/qa-universal/knowledge-map
          if-no-files-found: error
          retention-days: 7
      - name: Conferir panorama horário em celular, tablet e desktop nos dois temas
        run: POPUP_QA_OUTPUT="$RUNNER_TEMP/qa-universal/market-popup" node scripts/smoke-market-popup.cjs
      - name: Conferir ICMS-ST, motion e movimento reduzido
        run: ICMS_QA_OUTPUT="$RUNNER_TEMP/qa-universal/icms-st" node scripts/smoke-icms-st.cjs
      - name: Capturas e relatório do diagrama ICMS-ST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icms-st-design
          path: ${{ runner.temp }}/qa-universal/icms-st
          if-no-files-found: error
          retention-days: 7
      - name: Conferir estudo histórico de controle de juros em três larguras
        run: JUROS_QA_OUTPUT="$RUNNER_TEMP/qa-juros" node scripts/smoke-aprender-juros.cjs
      - name: Capturas e relatório do estudo de juros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprender-juros-design
          path: ${{ runner.temp }}/qa-juros
          if-no-files-found: error
          retention-days: 7
      - name: Conferir seis calculadoras e alongamento em cinco larguras
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: CALCULATOR_QA_OUTPUT="$RUNNER_TEMP/qa-universal/calculators" node scripts/smoke-calculator-layout.cjs
      - name: Conferir estudos incluídos, recortes pendentes, apresentação e áudio
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: RESEARCHED_SECTORS_QA_OUTPUT="$RUNNER_TEMP/qa-universal/researched-sectors" node scripts/smoke-researched-sectors.cjs
      - name: Conferir pastas, histórico e recarga em oito cenários
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: FOLDERS_QA_OUTPUT="$RUNNER_TEMP/qa-universal/folders" node scripts/smoke-sector-folders.cjs
      - name: Verificar matriz de pastas e capturas completas
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: node scripts/verify-sector-folders.cjs "$RUNNER_TEMP/qa-universal/folders"
      - name: Capturas e relatório das pastas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pastas-setoriais-design
          path: ${{ runner.temp }}/qa-universal/folders
          if-no-files-found: error
          retention-days: 7
      - name: Capturas e relatório dos estudos setoriais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estudos-setoriais-design
          path: ${{ runner.temp }}/qa-universal/researched-sectors
          if-no-files-found: error
          retention-days: 7
      - name: Capturas da revisão das calculadoras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculadoras-design
          path: ${{ runner.temp }}/qa-universal/calculators
          if-no-files-found: ignore
          retention-days: 7
      - name: Conferir tema, Trends, alertas e falhas isoladas do BNDES
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          THEME_QA_OUTPUT: ${{ runner.temp }}/qa-universal/theme
          TRENDS_QA_OUTPUT: ${{ runner.temp }}/qa-universal/trends
          SMOKE_OUT: ${{ runner.temp }}/qa-universal/alertas-fontes
          PUBLISHED_QA_OUTPUT: ${{ runner.temp }}/qa-universal/delivered-build
        run: |
          failures=()
          for s in smoke-theme smoke-trends smoke-alerta smoke-bndes-source-failures smoke-published; do
            echo "::group::$s"
            if ! node scripts/$s.cjs; then
              failures+=("$s")
            fi
            echo "::endgroup::"
          done
          if (( ${#failures[@]} )); then
            echo "::error::Cenários corrigidos com falha: ${failures[*]}"
            exit 1
          fi
      - name: Conferir história dos juros, busca e navegação em Aprender
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: INTEREST_HISTORY_QA_OUTPUT="$RUNNER_TEMP/qa-universal/interest-history" node scripts/smoke-interest-history.cjs
      - name: Capturas da história dos juros em Aprender
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aprender-historia-juros
          path: ${{ runner.temp }}/qa-universal/interest-history
          if-no-files-found: ignore
          retention-days: 7
      - name: Conferir os fluxos alterados de busca, calculadoras e BNDES
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          SEARCH_QA_OUTPUT: ${{ runner.temp }}/qa-universal
          CALCULATOR_QA_OUTPUT: ${{ runner.temp }}/qa-universal/calculators
          FINIMP_QA_OUTPUT: ${{ runner.temp }}/qa-universal/finimp
          BNDES_QA_OUTPUT: ${{ runner.temp }}/qa-universal/bndes
          BNDES_PROFILES_QA_OUTPUT: ${{ runner.temp }}/qa-universal/bndes-profiles
          TIC_QA_OUTPUT: ${{ runner.temp }}/qa-universal/tic-laser
        run: |
          failures=()
          for s in smoke-global-search smoke-calculadora smoke-finimp smoke-bndes smoke-bndes-profiles smoke-tic-animation; do
            echo "::group::$s"
            if ! node scripts/$s.cjs; then
              failures+=("$s")
            fi
            echo "::endgroup::"
          done
          if (( ${#failures[@]} )); then
            echo "::error::Fluxos alterados com falha: ${failures[*]}"
            exit 1
          fi
      - name: Smokes de navegador (abas, mercado, calendário e controles de 44 px)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: |
          failures=()
          for s in smoke-mascot-controls smoke-ui smoke-market-table smoke-data-health smoke-market-workspace smoke-market-followup smoke-ux smoke-chart-compare smoke-outros smoke-juros-regioes smoke-date-range smoke-cupom smoke-calendario smoke-heavy-vehicles smoke-setores-navigation smoke-dynamic-notifications smoke-finimp-help smoke-recado smoke-conceito-diario smoke-motion smoke-apresentacao; do
            echo "::group::$s"
            if ! FINIMP_HELP_QA_OUTPUT="$RUNNER_TEMP/qa-universal/finimp-help" SETORES_QA_OUTPUT="$RUNNER_TEMP/qa-universal/setores" SEARCH_QA_OUTPUT="$RUNNER_TEMP/qa-universal" CONCEITO_QA_OUTPUT="$RUNNER_TEMP/qa-c" UX_QA_OUTPUT="$RUNNER_TEMP/qa-ux" TABLE_QA_OUTPUT="$RUNNER_TEMP/qa-t" WORKSPACE_QA_OUTPUT="$RUNNER_TEMP/qa-w" FOLLOWUP_QA_OUTPUT="$RUNNER_TEMP/qa-f" node scripts/$s.cjs; then
              failures+=("$s")
            fi
            echo "::endgroup::"
          done
          if (( ${#failures[@]} )); then
            echo "::error::Smokes com falha: ${failures[*]}"
            exit 1
          fi
      - name: Seleção temporal com mouse e toque nos componentes
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: |
          npm run dev -- --host 127.0.0.1 --port 8770 > "$RUNNER_TEMP/comparison-vite.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8770/test/fixtures/chart-comparison.html > /dev/null && break; sleep 1; done
          SMOKE_BASE_URL=http://127.0.0.1:8770 COMPARISON_QA_OUTPUT="$RUNNER_TEMP/qa-universal" node scripts/smoke-chart-comparison.cjs
      - name: Verificar matriz de oito calculadoras e cabeçalho Setores320
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: node scripts/verify-smoke-matrix.cjs "$RUNNER_TEMP/qa-universal"
      - name: Capturas de tela dos smokes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-capturas
          path: |
            ${{ runner.temp }}/qa-ux
            ${{ runner.temp }}/qa-t
            ${{ runner.temp }}/qa-w
            ${{ runner.temp }}/qa-f
            ${{ runner.temp }}/qa-c
            ${{ runner.temp }}/qa-universal
          if-no-files-found: ignore
          retention-days: 7
  bndes-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cotacoes
    env:
      SMOKE_BASE_URL: http://127.0.0.1:8768
      SMOKE_CHANNEL: chrome
      CHROMIUM_PATH: /usr/bin/google-chrome
      BNDES_WORKSPACE_QA_OUTPUT: /tmp/bndes-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: VITE_DATA_BASE=http://127.0.0.1:8768 npm run build
      - run: npm install --no-save playwright@1.63.0
      - name: Servir e conferir a central BNDES
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/bndes-server.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
          node scripts/smoke-bndes-workspace.cjs
      - name: Conferir regressões das calculadoras e do BNDES
        env:
          CALCULATOR_QA_OUTPUT: /tmp/bndes-workspace/calculators
          BNDES_QA_OUTPUT: /tmp/bndes-workspace/bndes
          BNDES_PROFILES_QA_OUTPUT: /tmp/bndes-workspace/bndes-profiles
        run: |
          failures=()
          for s in smoke-calculator-layout smoke-calculadora smoke-bndes smoke-bndes-profiles; do
            if ! node scripts/$s.cjs; then failures+=("$s"); fi
          done
          if (( ${#failures[@]} )); then printf 'Falhas: %s\n' "${failures[*]}"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bndes-workspace-design
          path: /tmp/bndes-workspace
          if-no-files-found: error
          retention-days: 7

  sector-graph:
    runs-on: ubuntu-24.04
    needs: test-build
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cotacoes
    env:
      SMOKE_BASE_URL: http://127.0.0.1:8768
      SMOKE_CHANNEL: chrome
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - run: VITE_DATA_BASE=http://127.0.0.1:8768 npm run build
      - run: npm install --no-save playwright@1.63.0
      - name: Conferir grafo contextual sem bloquear outros smokes
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/sector-graph-server.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
          SECTOR_GRAPH_QA_OUTPUT="$RUNNER_TEMP/sector-graph" node scripts/smoke-sector-graph.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sector-graph-design
          path: ${{ runner.temp }}/sector-graph
          if-no-files-found: error
          retention-days: 7

  intraday-state:
    runs-on: ubuntu-24.04
    needs: test-build
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cotacoes
    env:
      SMOKE_BASE_URL: http://127.0.0.1:8768
      CHROMIUM_PATH: /usr/bin/google-chrome
      SMOKE_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - run: VITE_DATA_BASE=http://127.0.0.1:8768 npm run build
      - run: npm install --no-save playwright@1.63.0
      - name: Servir e conferir amostras e atraso do intraday
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/intraday-server.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
          INTRADAY_QA_OUTPUT="$RUNNER_TEMP/qa-intraday" node scripts/smoke-intraday-state.cjs
      - name: Capturas, resultado e eventual erro do intraday
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-state-design
          path: ${{ runner.temp }}/qa-intraday
          if-no-files-found: error
          retention-days: 7
