name: Diagnóstico busca de fundos (temporário)
on:
  push:
    branches: ['investimentos-busca-fundos']
    paths: ['.github/workflows/diag-busca-fundos.yml', 'cotacoes/scripts/diag-busca-fundos.cjs']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0
      - run: |
          nohup python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
      - run: node scripts/diag-busca-fundos.cjs
