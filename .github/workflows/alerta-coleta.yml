name: Alerta de coleta com falhas seguidas

# Quando uma coleta termina, olha as últimas execuções dela. Se as 3 mais recentes (que terminaram em sucesso ou falha)
# falharam, abre uma issue ou comenta na que já existe. Quando uma execução volta a dar certo, comenta e fecha a issue.
# Não altera os workflows de coleta: só observa o resultado deles. Mesmo padrão de issue da validação de cotações em pages.yml.
#
# Teste de alerta: o botão "Run workflow" desta rotina (execução manual) envia ao Teams uma mensagem marcada como TESTE e
# diz no resumo da execução se chegou. O teste não abre issue nem mexe em nenhuma coleta.
on:
  workflow_run:
    workflows:
      - Cotações (coleta central)
      - Deploy do PEME (GitHub Pages)
      - Verificar e coletar notícias institucionais
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  alerta:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Abrir, atualizar ou fechar a issue de falhas seguidas
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            // Aviso ao Teams: nunca falha em silêncio, nunca derruba a rotina e nunca mostra o endereço do segredo.
            const avisarTeams = async (text) => {
              const naoEnviado = (motivo) => { core.warning(`Aviso ao Teams NÃO enviado: ${motivo}`); return { ok: false, motivo } }
              const url = process.env.TEAMS_WEBHOOK_URL
              if (!url) return naoEnviado('o segredo TEAMS_WEBHOOK_URL não está configurado neste repositório.')
              try {
                const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }), signal: AbortSignal.timeout(15000) })
                if (!res.ok) return naoEnviado(`o Teams respondeu com erro (código ${res.status}).`)
                const corpo = await res.text().catch(() => '')
                if (/failed|error/i.test(corpo)) return naoEnviado('o Teams recebeu a mensagem, mas avisou que a entrega falhou.')
                return { ok: true }
              } catch (e) {
                return naoEnviado(`falha de rede ou tempo esgotado (${e?.name ?? 'erro'}).`)
              }
            }
            const LIMITE = 3
            const atual = context.payload.workflow_run
            // execuções canceladas ou puladas não contam como sucesso nem como falha
            if (!['success', 'failure', 'timed_out'].includes(atual.conclusion)) return
            const lista = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: atual.workflow_id, status: 'completed', per_page: 20 })
            const outras = lista.data.workflow_runs.filter((r) => r.id !== atual.id && ['success', 'failure', 'timed_out'].includes(r.conclusion))
            const recentes = [atual, ...outras].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, LIMITE)
            const falhou = (r) => r.conclusion !== 'success'
            const title = `Coleta falhou ${LIMITE} vezes seguidas: ${atual.name}`
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 })
            const prev = open.data.find((i) => i.title === title && !i.pull_request)
            const run = atual.html_url
            if (recentes.length === LIMITE && recentes.every(falhou)) {
              const list = recentes.map((r) => `- ${r.created_at}: ${r.html_url}`).join('\n')
              const body = `As ${LIMITE} últimas execuções de "${atual.name}" falharam. A página continua mostrando os últimos dados válidos, que podem estar ficando velhos.\n\n${list}`
              if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body })
              else {
                await github.rest.issues.create({ ...context.repo, title, body })
                await avisarTeams(`${title}. ${run}`)
              }
            } else if (prev && atual.conclusion === 'success') {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body: `Normalizado: a última execução deu certo.\n\nExecução: ${run}` })
              await github.rest.issues.update({ ...context.repo, issue_number: prev.number, state: 'closed', state_reason: 'completed' })
            }
  teste:
    # Execução manual: só envia a mensagem de teste. Não precisa de nenhuma permissão do repositório.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enviar mensagem de TESTE ao Teams e dizer se chegou
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            // Aviso ao Teams: nunca falha em silêncio, nunca derruba a rotina e nunca mostra o endereço do segredo.
            const avisarTeams = async (text) => {
              const naoEnviado = (motivo) => { core.warning(`Aviso ao Teams NÃO enviado: ${motivo}`); return { ok: false, motivo } }
              const url = process.env.TEAMS_WEBHOOK_URL
              if (!url) return naoEnviado('o segredo TEAMS_WEBHOOK_URL não está configurado neste repositório.')
              try {
                const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }), signal: AbortSignal.timeout(15000) })
                if (!res.ok) return naoEnviado(`o Teams respondeu com erro (código ${res.status}).`)
                const corpo = await res.text().catch(() => '')
                if (/failed|error/i.test(corpo)) return naoEnviado('o Teams recebeu a mensagem, mas avisou que a entrega falhou.')
                return { ok: true }
              } catch (e) {
                return naoEnviado(`falha de rede ou tempo esgotado (${e?.name ?? 'erro'}).`)
              }
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const r = await avisarTeams(`TESTE de alerta do PEME. É só um teste: nenhuma ação é necessária. Disparado à mão por ${context.actor}. ${run}`)
            const resumo = r.ok
              ? 'CHEGOU: o Teams aceitou a mensagem de TESTE. Confira no canal se ela aparece. Os alertas de verdade usam o mesmo caminho.'
              : `NÃO CHEGOU: ${r.motivo} Enquanto isso não for resolvido, os alertas só aparecem como issue no GitHub.`
            await core.summary.addHeading('Teste de alerta no Teams', 2).addRaw(resumo, true).addRaw('Este teste não abriu issue e não mexeu em nenhuma coleta.', true).write()
            if (r.ok) core.notice(resumo)
            else core.setFailed(resumo)
