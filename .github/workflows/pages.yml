name: Deploy do Painel Especialista (GitHub Pages)

on:
  push:
    branches: [main, claude/obsidian-plugin-analysis-bagjz3]
    paths: ['cotacoes/**', '.github/workflows/pages.yml', '.github/workflows/cotacoes-ci.yml']
  schedule:
    - cron: '0 11,18 * * *' # Trends: 08h e 15h de Brasília; demais fontes preservadas
    # Só de segunda a sexta no horário de Brasília (UTC-3): segunda 00h a sexta 23h. Sem coleta no sábado e no domingo.
    - cron: '17 3-23 * * 1-5' # segunda a sexta, 0h a 20h de Brasília
    - cron: '17 0-2 * * 2-6' # terça a sábado UTC = segunda a sexta, 21h a 23h de Brasília
    - cron: '30 11 * * 1,2' # Cenários/Focus: segunda 08:30 Brasília e repete terça 08:30 (Focus sai na terça quando segunda é feriado)
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false # A consulta semanal aguarda o deploy ativo; não o cancela.

jobs:
  verify-source:
    # The complete browser suite gates code releases, not hourly data refreshes.
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/cotacoes-ci.yml
    permissions:
      contents: read
  deploy:
    needs: verify-source
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Declaração de uso dos dados do Banco do Japão (decisão do responsável pelo projeto, 27/10/2026): uso não comercial.
      # Hoje só habilita o leitor opcional de comunicados em PDF; a taxa do BoJ vem do BIS e não depende desta variável.
      POLICY_BOJ_USE: noncommercial
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - name: Exigir verificações antes de publicar código
        if: github.event_name != 'schedule' && needs.verify-source.result != 'success'
        uses: actions/github-script@v7
        with:
          script: core.setFailed('Verificações de código ou interface não passaram. Publicação bloqueada.')
      - name: Exigir código já aprovado nas agendas de dados
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'pages.yml', head_sha: context.sha,
              status: 'completed', per_page: 100,
            })
            const required = ['test-build', 'smoke', 'bndes-workspace']
            for (const run of runs) {
              if (run.id === context.runId || run.head_sha !== context.sha || run.conclusion !== 'success' || !['push', 'workflow_dispatch'].includes(run.event)) continue
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
              })
              if (!required.every(id => jobs.some(job => job.name === `verify-source / ${id}` && job.conclusion === 'success'))) continue
              core.info(`Código ${context.sha} aprovado e publicado na execução ${run.id}.`)
              return
            }
            core.setFailed(`Agenda bloqueada: o código ${context.sha} ainda não possui publicação aprovada com todos os testes de código e interface. Execute a publicação manual ou corrija a falha do push; nenhum código será publicado por esta agenda.`)
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotacoes/package-lock.json
      - run: npm ci
      - name: Conferir referências setoriais do IBGE para CBS (preserva base em falha)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/fetch-ibge-cbs.py
        timeout-minutes: 2
      - name: Google Trends (08h e 15h; preserva nas demais execuções)
        run: node scripts/fetch-trends.mjs
        timeout-minutes: 2
        env:
          TRENDS_COLLECT: ${{ github.event.schedule == '0 11,18 * * *' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
      - name: Preservar as demais bases na atualização exclusiva de Trends
        if: github.event.schedule == '0 11,18 * * *'
        run: node scripts/preserve-for-trends.mjs "$RUNNER_TEMP/weekly-data-snapshot.json"
      - name: Testes (parsers e lógica)
        run: npm test
      - name: Validar lote documental sem áudio conforme publicação autorizada
        run: node scripts/validate-sector-release.mjs --require-audio --allow-no-audio
      - name: Atualizar Focus semanal preservando os demais dados publicados
        if: github.event.schedule == '30 11 * * 1,2'
        run: node scripts/refresh-scenarios.mjs "$RUNNER_TEMP/weekly-data-snapshot.json"
        timeout-minutes: 5
      - name: Histórico do Focus (52 semanas; de hora em hora só preserva o publicado)
        if: github.event.schedule != '0 11,18 * * *'
        run: node scripts/fetch-focus-history.mjs
        continue-on-error: true
        timeout-minutes: 3
        env:
          FOCUS_WEEKLY: ${{ github.event.schedule == '30 11 * * 1,2' }}
      - name: Coletar notícias
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-news.mjs
        env:
          NEWS_STRICT: ${{ github.event_name == 'schedule' }}
      - name: Coletar dados do Banco Central (CDI, Selic, Focus, PTAX)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-macro.mjs
        timeout-minutes: 15
        env:
          MACRO_STRICT: ${{ github.event_name == 'schedule' }}
      - name: Coletar curvas de juros (DI x pré e Treasuries)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-curves.mjs
        env:
          CURVES_STRICT: ${{ github.event_name == 'schedule' }}
      - uses: actions/setup-python@v5
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2' || env.POLICY_BOJ_USE == 'noncommercial' || env.POLICY_BOJ_USE == 'permission-confirmed')
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Preparar leitura dos comunicados oficiais em PDF
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2' || env.POLICY_BOJ_USE == 'noncommercial' || env.POLICY_BOJ_USE == 'permission-confirmed')
        continue-on-error: true
        run: python -m pip install -r scripts/requirements-policy.txt
      - name: Coletar juros de política monetária (Fed, BCE, BoE e BoJ)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-policy-rates.mjs
        timeout-minutes: 5
      - name: Coletar €STR (Banco Central Europeu)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-estr.mjs
        timeout-minutes: 2
      - name: Coletar curva de juros do euro (Banco Central Europeu)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-euro-curve.mjs
        timeout-minutes: 3
      - name: Coletar indexadores TR, TBF e TLP (Banco Central)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-indexadores.mjs
        continue-on-error: true
        timeout-minutes: 5
      - name: Coletar Taxa Fixa do BNDES (TFB, 4 prazos, liberação em 30 e 90 dias)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-bndes.mjs
        continue-on-error: true
        timeout-minutes: 5
      - name: Coletar TFC e moedas contratuais do BNDES
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-moedas.mjs
        continue-on-error: true
        timeout-minutes: 8
      - name: Gerar CSV das séries do BNDES (Power Query)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/export-csv.mjs
        continue-on-error: true
        timeout-minutes: 2
      - name: Coletar feriados da China (dados oficiais)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-holidays.mjs
        continue-on-error: true
      - name: Curadoria de tributos e escala 6x1 (últimos sete dias)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-curadoria.mjs
        timeout-minutes: 2
        continue-on-error: true
      - name: Coletar matérias da semana sobre a reforma tributária (Google Notícias)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-reforma.mjs
        timeout-minutes: 3
        continue-on-error: true
      - name: Coletar matérias da semana por setor e insumo (Google Notícias)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-temas.mjs
        timeout-minutes: 4
        continue-on-error: true
      - name: Reter matérias do mapa por sete dias sem nova coleta
        # Também roda nos pacotes de Trends/Focus sem alterar dados preservados.
        # Antecede a poda setorial de cinco dias para guardar itens ainda válidos.
        run: node scripts/refresh-knowledge-news.mjs
        timeout-minutes: 2
      - name: Revalidar janela setorial sem coleta externa
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-sector-news.mjs --offline
        timeout-minutes: 12
        continue-on-error: true
      - name: Coletar acessos ao app (Umami, link de compartilhamento)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-acessos.mjs
        timeout-minutes: 2
        continue-on-error: true
      - name: Coletar preço diário aproximado do cobre (COMEX via Yahoo)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-insumos-precos.mjs
        timeout-minutes: 2
        continue-on-error: true
      - name: Coletar fechamento diário do Ibovespa (Yahoo)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-indices.mjs
        timeout-minutes: 2
        continue-on-error: true
      - name: Coletar referência diária de petróleo Brent (EIA)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-oil.mjs
        timeout-minutes: 2
      - name: Coletar commodities diárias e mensais (EIA e Banco Mundial)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-commodities.mjs
        timeout-minutes: 3
      - name: Coletar commodities em reais (IC-Br e soja em R$/saca)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-commodities-brl.mjs
        timeout-minutes: 3
      - name: Coletar preços de combustíveis ao consumidor (ANP)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-fuels.mjs
        timeout-minutes: 8
      - name: Coletar referência mensal de transporte marítimo (BLS, EUA)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-freight.mjs
      - name: Coletar referência mensal de transporte marítimo do Japão (Banco do Japão)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-freight-jp.mjs
        timeout-minutes: 2
      - name: Coletar IPCA oficial e histórico (IBGE)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-ipca.mjs
        timeout-minutes: 2
      - name: Coletar dívida bruta do governo geral (Banco Central)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-divida.mjs
        timeout-minutes: 4
      - name: Coletar IPCA por grupos (IBGE)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-ipca-groups.mjs
        timeout-minutes: 2
      - name: Coletar calendário econômico (Forex Factory, BLS, BEA e Fed)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-calendar.mjs
        timeout-minutes: 3
      - name: Coletar veículos pesados (Carta mensal da ANFAVEA)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-heavy-vehicles.mjs
      - name: Coletar inadimplência PF e PJ (Banco Central)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-inadimplencia.mjs
        timeout-minutes: 10
      - name: Coletar balanços e carteiras dos bancos (IF.data)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-bancos.mjs
        timeout-minutes: 8
      - name: Conferir referências de recuperação judicial (semanal, sem contagens)
        if: github.event.schedule != '0 11,18 * * *' && (github.event.schedule != '30 11 * * 1,2')
        run: node scripts/fetch-recuperacao.mjs
        timeout-minutes: 2
      - name: Verificar dados desatualizados
        run: node scripts/check-stale.mjs
        continue-on-error: true
      - name: Validar coerência dos dados publicados
        run: node scripts/validate-data.mjs
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          VITE_DATA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/data
      - name: Conferir todas as bases preservadas no pacote semanal
        if: github.event.schedule == '30 11 * * 1,2' || github.event.schedule == '0 11,18 * * *'
        run: node scripts/weekly-data.mjs dist "$RUNNER_TEMP/weekly-data-snapshot.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cotacoes/dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Conferir a interface no endereço publicado
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        env:
          SMOKE_PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLISHED_QA_OUTPUT: ${{ runner.temp }}/qa-published
          SMOKE_CHANNEL: chrome
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save playwright@1.63.0
          node scripts/smoke-published.cjs
      - name: Capturas da versão publicada
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: publicado-verificado
          path: ${{ runner.temp }}/qa-published
          if-no-files-found: ignore
          retention-days: 7
      - name: Avisar falha do deploy (issue + Teams, se configurado)
        if: failure()
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = 'Deploy da página de cotações falhou'
            const outcome = process.env.DEPLOYMENT_OUTCOME
            const status = outcome === 'success'
              ? 'A publicação foi concluída, mas uma verificação posterior falhou. A nova versão pode estar no ar; confira o endereço publicado e o relatório antes de decidir restaurar uma versão.'
              : outcome === 'failure'
                ? 'O serviço de publicação retornou falha. O estado no ar precisa ser conferido; não é possível garantir que a versão anterior foi preservada.'
                : 'A atualização falhou antes da publicação. Esta execução não enviou uma nova versão ao serviço de publicação.'
            const body = `${status}\n\nExecução: ${run}\nGatilho: ${context.eventName}`
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 })
            const prev = open.data.find((i) => i.title === title && !i.pull_request)
            if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body })
            else await github.rest.issues.create({ ...context.repo, title, body })
            if (process.env.TEAMS_WEBHOOK_URL) {
              await fetch(process.env.TEAMS_WEBHOOK_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: `${title}: ${run}` }) }).catch(() => {})
            }
      - name: Alertar dados desatualizados há mais de 6 horas (issue + Teams, se configurado)
        if: always()
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const fs = require('fs')
            const file = `${process.env.RUNNER_TEMP}/stale.json`
            if (!fs.existsSync(file)) return
            const { hours, items } = JSON.parse(fs.readFileSync(file, 'utf8'))
            const title = `Dados da página de cotações desatualizados há mais de ${hours} horas`
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 })
            const prev = open.data.find((i) => i.title === title && !i.pull_request)
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (items.length) {
              const list = items.map((i) => `- ${i.detail ?? `${i.label}: ${i.hours == null ? 'data da coleta desconhecida' : `${i.hours} h sem atualizar`}`}`).join('\n')
              const body = `A página conserva dados anteriores. Consulte o motivo de cada item; a idade do dado, isoladamente, não comprova indisponibilidade da fonte:\n\n${list}\n\nExecução: ${run}`
              if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body })
              else {
                await github.rest.issues.create({ ...context.repo, title, body })
                if (process.env.TEAMS_WEBHOOK_URL) await fetch(process.env.TEAMS_WEBHOOK_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: `${title}: ${items.map((i) => i.label).join(', ')}. ${run}` }) }).catch(() => {})
              }
            } else if (prev) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body: `Normalizado: nenhum bloco desatualizado há mais de ${hours} horas.\n\nExecução: ${run}` })
              await github.rest.issues.update({ ...context.repo, issue_number: prev.number, state: 'closed', state_reason: 'completed' })
            }
      - name: Alertar dados incoerentes (issue + Teams, se configurado)
        if: always()
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const fs = require('fs')
            const file = `${process.env.RUNNER_TEMP}/validation.json`
            if (!fs.existsSync(file)) return
            const { items } = JSON.parse(fs.readFileSync(file, 'utf8'))
            const title = 'Dados da página de cotações com problema de validação'
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 })
            const prev = open.data.find((i) => i.title === title && !i.pull_request)
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (items.length) {
              const list = items.map((i) => `- [${i.area}] ${i.message}`).join('\n')
              const body = `A validação automática encontrou incoerências nos dados publicados:\n\n${list}\n\nExecução: ${run}`
              if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body })
              else {
                await github.rest.issues.create({ ...context.repo, title, body })
                if (process.env.TEAMS_WEBHOOK_URL) await fetch(process.env.TEAMS_WEBHOOK_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: `${title}: ${items.length} problema(s). ${run}` }) }).catch(() => {})
              }
            } else if (prev) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body: `Normalizado: dados consistentes.\n\nExecução: ${run}` })
              await github.rest.issues.update({ ...context.repo, issue_number: prev.number, state: 'closed', state_reason: 'completed' })
            }
