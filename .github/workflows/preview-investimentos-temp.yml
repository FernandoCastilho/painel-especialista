name: Capturas temporárias de Investimentos
on:
  push:
    branches: [investimentos-fundos-nomes-datas]
    paths: [.github/workflows/preview-investimentos-temp.yml]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: cotacoes
        run: |
          npm ci
          npm run build
          npm install --no-save playwright@1.63.0
          nohup python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
          OUT="$GITHUB_WORKSPACE/qa-capturas-temp" node scripts/preview-investimentos-temp.cjs
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add qa-capturas-temp
          git commit -m "Capturas temporárias de Investimentos (sai antes de juntar)"
          git push
