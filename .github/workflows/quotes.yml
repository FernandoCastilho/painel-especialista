name: Cotações (coleta central)

# Um único robô consulta a AwesomeAPI e publica quotes.json, intraday.json e history.json na branch `data`.
# Todos os usuários leem esses arquivos: a cota da API não depende de quantas pessoas abrem a página.
#
# Coleta intensiva (9h05 às 18h de Brasília = 12h05 às 21h UTC, dias de pregão da B3; feriado conta como fora do pregão): o agendamento do GitHub não garante
# execuções a cada 5 min (na prática atrasa ou pula horas). Por isso cada execução do pregão fica ligada e coleta
# a cada 5 min pelo relógio, até o fim do pregão ou até 5h40 de duração (limite de 6 h por job). Três partidas
# escalonadas cobrem o dia: enquanto uma roda, a seguinte espera na fila (concurrency) e assume quando ela termina.
# Fora do pregão, cada execução coleta uma vez.
on:
  schedule:
    # Partidas do pregão (a 1ª cobre a manhã; as outras são reserva e continuação).
    - cron: '5 12 * * 1-5'
    - cron: '20 15 * * 1-5'
    - cron: '50 17 * * 1-5'
    # Fora do pregão, 1 vez por hora, só de segunda a sexta: 0h07 às 8h07 e 18h07 às 23h07 de Brasília. Nada no sábado e no domingo.
    - cron: '7 3-11 * * 1-5'
    - cron: '7 21-23 * * 1-5'
    - cron: '7 0-2 * * 2-6'
  workflow_dispatch:

concurrency:
  group: quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Navegador sem janela para ler a página do CDS (o número só aparece depois que a página carrega). Falha aqui não para as cotações.
      - name: Preparar leitor da página do CDS
        continue-on-error: true
        timeout-minutes: 3
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.63.0
      - name: Coletar e publicar (laço de 5 min no pregão, uma vez fora dele)
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
          DATA_DIR: /tmp/data
          AWESOMEAPI_KEY: ${{ secrets.AWESOMEAPI_KEY }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          # janela de coleta intensiva: 09h05 a 18h de Brasília, só em dia de pregão da B3 (dólar futuro: 9h às 18h).
          # Em feriado da B3 cada partida coleta uma vez só, como fora do pregão. Regra em cotacoes/scripts/data-schedules.mjs.
          in_session() { node cotacoes/scripts/fx-session.mjs; }
          # Dados anteriores (branch data). Devolve 0 quando o estado é conhecido: arquivos baixados, ou a branch ainda não existe
          # (primeira publicação). Falha de rede NÃO é "branch não existe": devolve 1 e a rodada não coleta nem publica, porque a
          # publicação substitui a branch inteira e o intradiário de 5 dias recomeçaria do zero.
          baixar_anteriores() {
            local rc f n
            mkdir -p "$DATA_DIR"
            for n in 1 2 3; do
              rc=0
              git ls-remote --exit-code --heads origin data >/dev/null 2>&1 || rc=$?
              if [ "$rc" -eq 2 ]; then echo "branch data ainda não existe: primeira publicação"; return 0; fi
              if [ "$rc" -eq 0 ] && git fetch -q --depth=1 origin data; then
                rc=0
                for f in quotes.json intraday.json history.json cds.json; do
                  # arquivo que não existe na branch é normal (ex.: history na primeira vez); arquivo que existe precisa ser lido
                  if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then git show "FETCH_HEAD:$f" > "$DATA_DIR/$f" || rc=1; fi
                done
                [ "$rc" -eq 0 ] && return 0
              fi
              [ "$n" -lt 3 ] && sleep $((n * 5))
            done
            return 1
          }
          base_ok=false
          collect_and_publish() {
            if [ "$base_ok" != true ]; then
              if baixar_anteriores; then base_ok=true
              else echo "::warning::Não foi possível ler os dados anteriores (branch data). Rodada sem coleta e sem publicação, para não apagar o histórico; tenta de novo na próxima."; return 0; fi
            fi
            node cotacoes/scripts/fetch-quotes.mjs || echo "coleta com erro; mantidos os arquivos anteriores"
            # Manchetes do dólar do dia (notícias perto da máxima): na 1ª rodada e de 15 em 15 minutos. Nunca trava as cotações.
            if [ ! -f "$DATA_DIR/fx-agora.json" ] || [ $((10#$(date -u +%M) % 15)) -lt 5 ]; then
              timeout 60 node cotacoes/scripts/fetch-fx-agora.mjs || echo "manchetes do momento com erro; mantido o arquivo anterior"
            fi
            # CDS Brasil 5 anos (World Government Bonds, não oficial): o script só visita o site a cada ~2 h; falha não afeta as cotações.
            timeout 150 node cotacoes/scripts/fetch-cds.mjs || echo "CDS: coleta com erro; mantido o último dado válido"
            [ -f "$DATA_DIR/quotes.json" ] || { echo "nada a publicar"; return 0; }
            (
              cd "$DATA_DIR"
              rm -rf .git
              git init -q
              git checkout -q -b data
              git add -A
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "cotações $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q -f "$PUSH_URL" data
            ) || echo "publicação falhou nesta rodada; tenta de novo na próxima"
          }
          start=$(date +%s)
          deadline=$((start + 340 * 60))
          collect_and_publish
          rounds=1
          while in_session && [ "$(date +%s)" -lt "$deadline" ]; do
            # dorme até o próximo múltiplo de 5 min (+5 s), para as coletas caírem em horários previsíveis
            sleep $((300 - $(date +%s) % 300 + 5))
            in_session && [ "$(date +%s)" -lt "$deadline" ] || break
            collect_and_publish
            rounds=$((rounds + 1))
          done
          echo "rodadas nesta execução: $rounds"
