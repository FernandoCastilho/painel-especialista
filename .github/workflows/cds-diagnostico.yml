# TEMPORÁRIO: coleta real do CDS (12 meses) num diretório de teste, sem publicar nada, e mostra o cartão do Panorama
# com esse dado real. A imagem sai no log porque os arquivos de teste nem sempre são acessíveis. Sai antes do PR final.
name: CDS diagnóstico (temporário)
on:
  push:
    branches: [claude/cds-grafico-historico]
    paths: ['.github/workflows/cds-diagnostico.yml']
jobs:
  ler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: cotacoes } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cotacoes/package-lock.json }
      - run: npm ci && npm install --no-save playwright@1.63.0
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - name: Coleta real em diretório de teste (não publica)
        run: |
          DATA_DIR="$RUNNER_TEMP/cds" PLAYWRIGHT_DIR="$PWD" node scripts/fetch-cds.mjs
          node -e "const d=require('$RUNNER_TEMP/cds/cds.json');const h=d.history;console.log(JSON.stringify({value:d.value,error:d.error,reference:d.reference,dias:h.length,primeiro:h[0],ultimos:h.slice(-4)}))"
      - run: VITE_DATA_BASE=http://127.0.0.1:8768 npm run build
      - name: Cartão do Panorama com o dado real
        run: |
          nohup python3 -m http.server 8768 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &
          sleep 2
          cat > "$RUNNER_TEMP/print.cjs" <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright')
          const fs = require('fs')
          const cds = JSON.parse(fs.readFileSync(process.env.CDS_FILE, 'utf8'))
          ;(async () => {
            const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome', headless: true })
            const ctx = await b.newContext({ viewport: { width: 1366, height: 900 }, serviceWorkers: 'block' })
            await ctx.route('**/*', (r) => {
              const u = new URL(r.request().url()), name = u.pathname.split('/').pop()
              if (name === 'cds.json') return r.fulfill({ json: cds })
              if (name === 'recado.json') return r.fulfill({ json: { ativo: false } })
              return u.origin === 'http://127.0.0.1:8768' ? r.continue() : r.abort()
            })
            const p = await ctx.newPage()
            await p.goto('http://127.0.0.1:8768/#resumo')
            const aviso = p.locator('dialog.aviso-inicial[open]:not(.recado)')
            if (await aviso.isVisible({ timeout: 3000 }).catch(() => false)) await aviso.getByRole('button', { name: 'Entendi' }).click()
            await p.locator('.panorama-trigger').click()
            const card = p.locator('dialog.market-popup .mp-cds')
            await card.waitFor()
            console.log('CARTAO', (await card.innerText()).replace(/\s+/g, ' '))
            const img = await card.screenshot({ type: 'jpeg', quality: 80 })
            console.log('IMG_BEGIN'); for (let i = 0; i < img.toString('base64').length; i += 8000) console.log('IMG:' + img.toString('base64').slice(i, i + 8000)); console.log('IMG_END')
            await b.close()
          })().catch((e) => { console.error(e); process.exit(1) })
          JS
          CDS_FILE="$RUNNER_TEMP/cds/cds.json" node "$RUNNER_TEMP/print.cjs"
