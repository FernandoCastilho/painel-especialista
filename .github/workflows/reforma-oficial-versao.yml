name: Reforma tributária — aviso de tabela oficial nova

# Uma vez por semana, compara a versão da calculadora oficial da Receita (regime regular) e a versão da
# tabela de dados dela com as que o painel usa em cotacoes/src/rtcOficial.json.
# Se a Receita publicou algo novo, abre uma issue (ou comenta na que já existe) e avisa no Teams.
# Não troca dados sozinha: a atualização é manual, com scripts/extract-rtc-oficial.py, testes e revisão.
on:
  schedule:
    - cron: '17 12 * * 1' # segundas, 09h17 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cotacoes/src/rtcOficial.json
          sparse-checkout-cone-mode: false
      - name: Comparar a versão oficial com a nossa e avisar se mudou
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const fs = require('node:fs')
            // Aviso ao Teams: nunca falha em silêncio, nunca derruba a rotina e nunca mostra o endereço do segredo.
            const avisarTeams = async (text) => {
              const naoEnviado = (motivo) => { core.warning(`Aviso ao Teams NÃO enviado: ${motivo}`); return { ok: false, motivo } }
              const url = process.env.TEAMS_WEBHOOK_URL
              if (!url) return naoEnviado('o segredo TEAMS_WEBHOOK_URL não está configurado neste repositório.')
              try {
                const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }), signal: AbortSignal.timeout(15000) })
                if (!res.ok) return naoEnviado(`o Teams respondeu com erro (código ${res.status}).`)
                const corpo = await res.text().catch(() => '')
                if (/failed|error/i.test(corpo)) return naoEnviado('o Teams recebeu a mensagem, mas avisou que a entrega falhou.')
                return { ok: true }
              } catch (e) {
                return naoEnviado(`falha de rede ou tempo esgotado (${e?.name ?? 'erro'}).`)
              }
            }
            const nossa = JSON.parse(fs.readFileSync('cotacoes/src/rtcOficial.json', 'utf8')).fonte
            const repo = { owner: 'ReceitaFederal', repo: 'calculadora-rtc-regime-regular' }
            const pom = await github.rest.repos.getContent({ ...repo, path: 'pom.xml' })
            const pomTexto = Buffer.from(pom.data.content, 'base64').toString('utf8')
            const versaoCalculadora = pomTexto.match(/<artifactId>CalculadorTributo<\/artifactId>\s*<version>([^<]+)<\/version>/)?.[1]
            const pasta = await github.rest.repos.getContent({ ...repo, path: 'flyway/sql/manutencao' })
            const numeros = pasta.data.map((f) => f.name.match(/^V(\d+)__/)?.[1]).filter(Boolean).map(Number)
            if (!versaoCalculadora || !numeros.length) throw new Error('Não consegui ler a versão oficial. Nada foi comparado.')
            const versaoBaseDados = `V${String(Math.max(...numeros)).padStart(4, '0')}`
            const commits = await github.rest.repos.listCommits({ ...repo, per_page: 1 })
            const ultimo = commits.data[0]
            const mudou = versaoCalculadora !== nossa.versaoCalculadora || versaoBaseDados !== nossa.versaoBaseDados
            const resumo = `Oficial: calculadora ${versaoCalculadora}, tabela ${versaoBaseDados}. Painel: calculadora ${nossa.versaoCalculadora}, tabela ${nossa.versaoBaseDados} (copiada em ${nossa.extraidoEm}).`
            await core.summary.addHeading('Tabela oficial da reforma tributária', 2).addRaw(resumo, true).addRaw(mudou ? 'Há versão nova: aviso aberto.' : 'Sem versão nova.', true).write()
            const title = 'Reforma tributária: a Receita publicou tabela nova da calculadora oficial'
            const abertas = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 50 })
            const prev = abertas.data.find((i) => i.title === title && !i.pull_request)
            if (mudou) {
              const body = `${resumo}\n\nÚltimo registro oficial: ${ultimo?.sha?.slice(0, 8)} em ${ultimo?.commit?.committer?.date} — ${ultimo?.html_url}\n\nA calculadora do painel continua com os dados antigos. Para atualizar: rodar \`scripts/extract-rtc-oficial.py\` numa cópia do repositório oficial, conferir as diferenças, rodar os testes e pedir revisão. Mudança de alíquota ou de redução é mudança de regra de cálculo: precisa do ok de Fernando.`
              if (prev) {
                // Comenta só quando a versão oficial mudou de novo, para não repetir o aviso toda semana.
                const comentarios = await github.rest.issues.listComments({ ...context.repo, issue_number: prev.number, per_page: 100 })
                if (![prev.body, ...comentarios.data.map((c) => c.body)].some((t) => t?.includes(resumo))) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body })
              } else {
                await github.rest.issues.create({ ...context.repo, title, body })
                await avisarTeams(`${title}. ${resumo}`)
              }
            } else if (prev) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body: `Resolvido: o painel já usa a versão oficial mais recente. ${resumo}` })
              await github.rest.issues.update({ ...context.repo, issue_number: prev.number, state: 'closed', state_reason: 'completed' })
            }
