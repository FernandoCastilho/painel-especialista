name: Coleta única do pregão fixado (temporária)
on:
  push:
    branches: [claude/pregao-fixado-coleta]
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cotacoes/scripts/fixar-pregao.mjs 2026-11-27 7 pregao-fixado.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pregao-fixado.json
          git commit -m 'resultado da coleta única [skip ci]'
          git push origin HEAD:claude/pregao-fixado-coleta-resultado
