name: Conferir sites das associações
# Confere se os endereços oficiais de src/sectorEntities.js ainda abrem. Não roda em pull request.
on:
  workflow_dispatch:
    inputs:
      extra_urls:
        description: 'Endereços candidatos para testar (separados por vírgula)'
        required: false
        default: ''
  schedule:
    - cron: '17 12 5 * *'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cotacoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir endereços
        env:
          CHECK_EXTRA_URLS: ${{ inputs.extra_urls }}
        run: node scripts/check-entity-links.mjs
